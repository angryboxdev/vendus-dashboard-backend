# Render Blueprint - Staging
# Ver: https://render.com/docs/blueprint-spec
#
# Nota: Cron Jobs no Render não usam plano "free" — o serviço cron abaixo fica em
# "starter" (ou define plan: starter explicitamente). O Web Service pode continuar free.
services:
  - type: web
    name: vendus-dashboard-api-staging
    runtime: node
    region: frankfurt

    buildCommand: npm ci && npm run build
    startCommand: npm run start

    envVars:
      - key: NODE_ENV
        value: staging
      - key: VENDUS_BASE_URL
        sync: false
      - key: VENDUS_API_KEY
        sync: false
      - key: CREDENTIALS_ENCRYPTION_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false

    # Opcional: health check
    healthCheckPath: /api/health

  # Consumo diário Vendus → movimentos de stock (docs/CRON_DAILY_STOCK.md)
  # Debita sempre o DIA ANTERIOR (calendário Lisboa), às 01:30 locais — ver nota UTC abaixo.
  # Render usa UTC: 01:30 Lisboa = 01:30 UTC no inverno (UTC+0) → "30 1 * * *".
  # No verão (UTC+1), 01:30 Lisboa = 00:30 UTC → troca manual para "30 0 * * *" ou ajusta no dashboard.
  - type: cron
    name: vendus-daily-vendus-consumption
    runtime: node
    region: frankfurt
    plan: starter
    schedule: "30 1 * * *"
    buildCommand: npm ci && npm run build
    startCommand: npm run cron:daily-vendus-consumption
    envVars:
      - key: NODE_ENV
        value: staging
      - key: VENDUS_BASE_URL
        sync: false
      - key: VENDUS_API_KEY
        sync: false
      - key: CREDENTIALS_ENCRYPTION_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
