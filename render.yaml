# Exported from Render on 2026-09-11T07:35:15Z
version: "1"
projects:
- name: Mezza
  environments:
  - name: Production
    services:
    - type: web
      name: mezza-api
      runtime: node
      repo: https://github.com/angryboxdev/vendus-dashboard-backend
      plan: starter
      envVars:
      # Regular variables
      - key: AIRMENU_SALES_SUMMARY_ENTERPRISE_ID
        sync: true
      - key: AIRMENU_ENTERPRISES
        sync: true
      - key: AIRMENU_ENTERPRISE_ID
        sync: true
      - key: AIRMENU_CLOSING_ENTERPRISE_ID
        sync: true
      - key: ENABLE_DAILY_CONSUMPTION_CRON
        sync: true
      - key: AIRMENU_USERNAME
        sync: true
      - key: VENDUS_REGISTER_ID
        sync: true
      - key: SUPABASE_URL
        sync: true
      - key: VENDUS_PER_PAGE
        sync: true
      - key: VENDUS_CONCURRENCY
        sync: true
      - key: VENDUS_BASE_URL
        sync: true
      
      # Secrets (sync: false)
      - key: VENDUS_API_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: AIRMENU_API_KEY
        sync: false
      - key: CREDENTIALS_ENCRYPTION_KEY
        sync: false
      - key: AIRMENU_PASSWORD
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: HR_KIOSK_HMAC_SECRET
        sync: false
      region: frankfurt
      buildCommand: npm ci && npm run build
      startCommand: npm run start
      healthCheckPath: /api/health
      autoDeployTrigger: commit
      branch: main
      
    - type: cron
      name: vendus-daily-vendus-consumption
      runtime: node
      repo: https://github.com/angryboxdev/vendus-dashboard-backend
      plan: starter
      envVars:
      - key: DB_PASSWORD
        sync: false
      - key: NODE_ENV
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: VENDUS_API_KEY
        sync: false
      - key: VENDUS_BASE_URL
        sync: false
      region: frankfurt
      buildCommand: npm ci && npm run build
      startCommand: npm run cron:daily-vendus-consumption
      schedule: 30 1 * * *
      autoDeployTrigger: commit
