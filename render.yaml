# Exported from Render on 2026-09-11T07:35:15Z
version: "1"
projects:
- name: Mezza
  environments:
  - name: Production
    services:
    - type: web
      name: mezza-api
      runtime: node
      repo: https://github.com/angryboxdev/vendus-dashboard-backend
      plan: starter
      envVars:
      # Regular variables
      - key: AIRMENU_SALES_SUMMARY_ENTERPRISE_ID
        value: "1783676282102"
      - key: AIRMENU_ENTERPRISES
        value: "1783676282102:Angry Box|1783676282104:Angry Box - Menu|1783676282106:Angry Box - Porto|1785509161620:Angry Box - Porto (teste)"
      - key: AIRMENU_ENTERPRISE_ID
        value: "1783676282102"
      - key: AIRMENU_CLOSING_ENTERPRISE_ID
        value: "1783676282106"
      - key: ENABLE_DAILY_CONSUMPTION_CRON
        value: "false"
      - key: AIRMENU_USERNAME
        value: general@angrybox.pt
      - key: VENDUS_REGISTER_ID
        value: "275787597"
      - key: SUPABASE_URL
        value: https://frbxmerhgnvhocwpuzrq.supabase.co
      - key: VENDUS_PER_PAGE
        value: "50"
      - key: VENDUS_CONCURRENCY
        value: "6"
      - key: VENDUS_BASE_URL
        value: https://www.vendus.pt/ws
      
      # Secrets (sync: false)
      - key: VENDUS_API_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: AIRMENU_API_KEY
        sync: false
      - key: CREDENTIALS_ENCRYPTION_KEY
        sync: false
      - key: AIRMENU_PASSWORD
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: HR_KIOSK_HMAC_SECRET
        sync: false
      # The following variables are only used by buildCommand and preDeployCommand to apply the migrations, not by the app runtime.
      - key: SUPABASE_ACCESS_TOKEN
        sync: false
      - key: SUPABASE_DB_PASSWORD
        sync: false
      region: frankfurt
      # --include=dev overrides NODE_ENV=production so check:ci/build have
      # devDependencies (jest, typescript, dependency-cruiser); prune puts
      # the running container back to prod-only deps afterward.
      buildCommand: npm ci --include=dev && npm run check:ci && npm run build && npm prune --omit=dev && npx --yes supabase db push --project-ref frbxmerhgnvhocwpuzrq --dry-run
      # `yes |` works around a supabase/cli bug where db push's confirmation
      # prompt exits 0 without applying migrations on non-TTY runners:
      # https://github.com/orgs/supabase/discussions/26366
      preDeployCommand: yes | npx --yes supabase db push --project-ref frbxmerhgnvhocwpuzrq
      startCommand: npm run start
      healthCheckPath: /api/health
      autoDeployTrigger: commit
      branch: main
      
    - type: cron
      name: vendus-daily-vendus-consumption
      runtime: node
      repo: https://github.com/angryboxdev/vendus-dashboard-backend
      plan: starter
      envVars:
      - key: DB_PASSWORD
        sync: false
      - key: NODE_ENV
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: VENDUS_API_KEY
        sync: false
      - key: VENDUS_BASE_URL
        sync: false
      region: frankfurt
      buildCommand: npm ci && npm run build
      startCommand: npm run cron:daily-vendus-consumption
      schedule: 30 1 * * *
      autoDeployTrigger: commit
